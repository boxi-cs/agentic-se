<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Model audit verification mechanism</title>
  <desc id="desc">A salient token can lead to an over-asserted claim when state or revision is skipped. A named route can leave a sibling path unprobed, causing a missed defect. The student runs an exact check on a frozen snapshot to confirm, refute, or mark a claim undetermined.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#254d48"/></marker></defs>
  <g font-family="Arial, sans-serif" fill="#18332f">
    <rect x="30" y="40" width="340" height="120" rx="14" fill="#f1e6d5" stroke="#254d48" stroke-width="2"/>
    <text x="55" y="78" font-size="20" font-weight="bold">Shortcut</text>
    <text x="55" y="112" font-size="17">salient token → confident claim</text>
    <text x="55" y="139" font-size="15">state or revision skipped</text>
    <path d="M370 100 H430" stroke="#254d48" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="430" y="40" width="340" height="120" rx="14" fill="#f8f4ed" stroke="#254d48" stroke-width="2"/>
    <text x="455" y="78" font-size="20" font-weight="bold">Exact evidence</text>
    <text x="455" y="112" font-size="17">frozen snapshot + input + state</text>
    <text x="455" y="139" font-size="15">run the check you chose</text>
    <path d="M770 100 H830" stroke="#254d48" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="830" y="40" width="340" height="120" rx="14" fill="#e7eee5" stroke="#254d48" stroke-width="2"/>
    <text x="855" y="78" font-size="20" font-weight="bold">Bounded decision</text>
    <text x="855" y="112" font-size="17">confirmed · refuted · undetermined</text>
    <text x="855" y="139" font-size="15">claim only what the run supports</text>
    <rect x="30" y="220" width="340" height="100" rx="14" fill="#e7eee5" stroke="#254d48" stroke-width="2"/>
    <text x="55" y="258" font-size="20" font-weight="bold">Named route</text>
    <text x="55" y="291" font-size="17">review follows one visible path</text>
    <path d="M370 270 H430" stroke="#254d48" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="430" y="220" width="340" height="100" rx="14" fill="#f1e6d5" stroke="#254d48" stroke-width="2"/>
    <text x="455" y="258" font-size="20" font-weight="bold">Sibling path</text>
    <text x="455" y="291" font-size="17">unprobed route → missed defect</text>
    <path d="M770 270 H830" stroke="#254d48" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="830" y="220" width="340" height="100" rx="14" fill="#f8f4ed" stroke="#254d48" stroke-width="2"/>
    <text x="855" y="258" font-size="20" font-weight="bold">Own check</text>
    <text x="855" y="291" font-size="17">probe it or bound the clean scope</text>
  </g>
</svg>
