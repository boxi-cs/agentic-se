<!doctype html>
<!-- Week 13 fixture: the workshop rehearsal page. Course-authored synthetic page with no script. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pipeline Alpha builds</title>
</head>
<body>
<nav aria-label="Dashboard">
  <a href="#overview">Overview</a>
</nav>
<main id="overview">
<h1>Pipeline Alpha builds</h1>
<form action="builds" method="get">
  <input type="hidden" name="pipeline" value="alpha">
  <button type="submit">Refresh</button>
  <details>
    <summary>Filter builds</summary>
    <label for="show">Show</label>
    <select id="show" name="status">
      <option value="all" selected>Everything</option>
      <option value="failed">Failed</option>
      <option value="running">Running</option>
    </select>
  </details>
</form>
<table aria-label="Builds">
  <thead><tr><th scope="col">Build</th><th scope="col">Status</th></tr></thead>
  <tbody><!-- The dashboard fills the rows from its query. --></tbody>
</table>
</main>
</body>
</html>
