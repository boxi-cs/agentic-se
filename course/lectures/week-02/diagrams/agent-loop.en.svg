<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">A bounded agent loop</title>
  <desc id="desc">The model proposes an action, the controller decides, a tool acts within an execution boundary, and an observation returns to the model.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#18332f"/></marker></defs>
  <g font-family="Georgia, serif" fill="#18332f">
    <rect x="15" y="65" width="185" height="100" rx="8" fill="#e4ebe5" stroke="#18332f" stroke-width="2"/>
    <text x="107" y="126" text-anchor="middle" font-size="31">Model</text>
    <rect x="270" y="65" width="195" height="100" rx="8" fill="#faf7ef" stroke="#18332f" stroke-width="2"/>
    <text x="367" y="111" text-anchor="middle" font-size="28">Action</text>
    <text x="367" y="145" text-anchor="middle" font-size="25">request</text>
    <rect x="535" y="65" width="255" height="100" rx="8" fill="#e4ebe5" stroke="#18332f" stroke-width="2"/>
    <text x="662" y="110" text-anchor="middle" font-size="30">Controller</text>
    <text x="662" y="146" text-anchor="middle" font-size="25">Decide</text>
    <rect x="920" y="35" width="265" height="157" fill="none" stroke="#18332f" stroke-dasharray="7 5" stroke-width="2"/>
    <text x="1052" y="22" text-anchor="middle" font-size="24">Enforced boundary</text>
    <rect x="946" y="65" width="213" height="100" rx="8" fill="#e4ebe5" stroke="#18332f" stroke-width="2"/>
    <text x="1052" y="110" text-anchor="middle" font-size="30">Tool</text>
    <text x="1052" y="146" text-anchor="middle" font-size="25">Execute action</text>
    <path d="M200 115 H257" fill="none" stroke="#18332f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M465 115 H522" fill="none" stroke="#18332f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M790 115 H933" fill="none" stroke="#18332f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="15" y="247" width="240" height="75" rx="6" fill="#faf7ef" stroke="#18332f" stroke-width="2"/>
    <text x="135" y="295" text-anchor="middle" font-size="28">Observation</text>
    <path d="M1052 192 V216 H290 V284 H267" fill="none" stroke="#18332f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M107 247 V177" fill="none" stroke="#18332f" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
