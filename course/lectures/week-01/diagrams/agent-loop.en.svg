<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">The model proposes; the controller decides whether a tool may act</title>
  <desc id="desc">The model sends an action request to the controller. The controller checks tool, arguments, path and budget. An allowed tool executes within its enforced boundary and returns an observation to the model. A rejected request stops instead.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#18332f"/></marker><marker id="stop-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#934126"/></marker></defs>
  <g font-family="Georgia, serif" fill="#18332f">
    <rect x="15" y="65" width="185" height="100" rx="8" fill="#e4ebe5" stroke="#18332f" stroke-width="2"/>
    <text x="107" y="126" text-anchor="middle" font-size="31">Model</text>
    <rect x="270" y="65" width="195" height="100" rx="8" fill="#faf7ef" stroke="#18332f" stroke-width="2"/>
    <text x="367" y="111" text-anchor="middle" font-size="28">Action</text>
    <text x="367" y="145" text-anchor="middle" font-size="25">request</text>
    <rect x="535" y="65" width="255" height="100" rx="8" fill="#e4ebe5" stroke="#18332f" stroke-width="2"/>
    <text x="662" y="110" text-anchor="middle" font-size="30">Controller</text>
    <text x="662" y="146" text-anchor="middle" font-size="25">Validate permission</text>
    <rect x="920" y="35" width="265" height="157" fill="none" stroke="#18332f" stroke-dasharray="7 5" stroke-width="2"/>
    <text x="1052" y="22" text-anchor="middle" font-size="24">Enforced boundary</text>
    <rect x="946" y="65" width="213" height="100" rx="8" fill="#e4ebe5" stroke="#18332f" stroke-width="2"/>
    <text x="1052" y="110" text-anchor="middle" font-size="30">Tool</text>
    <text x="1052" y="146" text-anchor="middle" font-size="25">Execute action</text>
    <path d="M200 115 H257 M465 115 H522 M790 115 H933" fill="none" stroke="#18332f" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="824" y="96" font-size="23">Allow</text>
    <rect x="550" y="257" width="225" height="65" rx="6" fill="#efe7d8" stroke="#934126" stroke-width="2"/>
    <text x="662" y="299" text-anchor="middle" font-size="28" fill="#934126">Refuse / stop</text>
    <path d="M662 165 V245" fill="none" stroke="#934126" stroke-width="3" marker-end="url(#stop-arrow)"/>
    <text x="680" y="242" font-size="23" fill="#934126">Reject</text>
    <rect x="15" y="247" width="240" height="75" rx="6" fill="#faf7ef" stroke="#18332f" stroke-width="2"/>
    <text x="135" y="295" text-anchor="middle" font-size="28">Observation</text>
    <path d="M1052 192 V216 H290 V284 H267 M107 247 V177" fill="none" stroke="#18332f" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
