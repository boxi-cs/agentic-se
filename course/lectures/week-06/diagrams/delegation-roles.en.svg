<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 400" role="img" aria-labelledby="title desc"><title id="title">Three roles in three launcher workspaces</title><desc id="desc">Planner workspace: issue and target file; exports plan. You read the plan and strike anything out of scope. Implementer workspace: issue, edited plan and target file; exports proposed file, diff and draft description. You run the checks through the launcher. Reviewer workspace: issue, diff, evidence and review rules only; exports review. The reviewer never sees the plan, the implementer prompt or the draft description.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#254d48"/></marker></defs><g fill="#18332f" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><rect x="24" y="40" width="330" height="250" rx="16" fill="#f1e6d5" stroke="#254d48" stroke-width="2"/><text x="48" y="82" font-size="22" fill="#934126" font-family="Georgia, serif">Planner</text><text x="48" y="126" font-size="18" font-family="DejaVu Sans Mono, Menlo, monospace">issue.md</text><text x="48" y="156" font-size="18" font-family="DejaVu Sans Mono, Menlo, monospace">target file</text><text x="48" y="206" font-size="18">exports plan.md</text><text x="48" y="250" font-size="17" font-style="italic">You strike out-of-scope steps</text><rect x="414" y="40" width="330" height="250" rx="16" fill="#f1e6d5" stroke="#254d48" stroke-width="2"/><text x="438" y="82" font-size="22" fill="#934126" font-family="Georgia, serif">Implementer</text><text x="438" y="126" font-size="18" font-family="DejaVu Sans Mono, Menlo, monospace">issue.md, plan.md</text><text x="438" y="156" font-size="18" font-family="DejaVu Sans Mono, Menlo, monospace">target file</text><text x="438" y="206" font-size="18">exports proposal, diff, draft</text><text x="438" y="250" font-size="17" font-style="italic">You run the checks</text><rect x="804" y="40" width="332" height="250" rx="16" fill="#e7eee5" stroke="#254d48" stroke-width="2"/><text x="828" y="82" font-size="22" fill="#934126" font-family="Georgia, serif">Reviewer (fresh)</text><text x="828" y="126" font-size="18" font-family="DejaVu Sans Mono, Menlo, monospace">issue.md, change.diff</text><text x="828" y="156" font-size="18" font-family="DejaVu Sans Mono, Menlo, monospace">evidence.txt, REVIEW.md</text><text x="828" y="206" font-size="18">exports review.txt</text><text x="828" y="250" font-size="17" font-style="italic">Nothing else is allowed</text><line x1="356" y1="165" x2="410" y2="165" stroke="#254d48" stroke-width="3" marker-end="url(#arrow)"/><line x1="746" y1="165" x2="800" y2="165" stroke="#254d48" stroke-width="3" marker-end="url(#arrow)"/><text x="24" y="350" font-size="19">The reviewer never sees the plan, the implementer's prompt or the drafted description.</text></g></svg>
